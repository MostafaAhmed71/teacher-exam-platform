name: Build Android Release APK (منصة مقياس - نسخة النشر)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build Production Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build React Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ciasypegalcdzxxqncqa.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpYXN5cGVnYWxjZHp4eHFuY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Nzc4MzAsImV4cCI6MjEwNDM1MzgzMH0.RKu47Pnw-Cg-5zHOTYxCeqRSiLhY9didyYPJ7FhaoAQ' }}
          VITE_PUBLIC_SITE_URL: 'https://amr-exam-platform.vercel.app'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore meqyas-release.keystore -alias meqyas -keyalg RSA -keysize 2048 -validity 10000 -storepass meqyas123456 -keypass meqyas123456 -dname "CN=Meqyas, OU=Education, O=Meqyas, L=Riyadh, S=Riyadh, C=SA"

      - name: Build & Sign Production Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Meqyas-Release-Signed.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks ../meqyas-release.keystore --ks-pass pass:meqyas123456 app/build/outputs/apk/release/Meqyas-Release-Signed.apk

      - name: Upload Production Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meqyas-Production-Release.apk
          path: android/app/build/outputs/apk/release/Meqyas-Release-Signed.apk
