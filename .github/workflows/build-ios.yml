name: Build iOS App Project (منصة مقياس - نسّخة آيفون iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-app:
    name: Build iOS Xcode Project & Archive
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ciasypegalcdzxxqncqa.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpYXN5cGVnYWxjZHp4eHFuY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Nzc4MzAsImV4cCI6MjEwNDM1MzgzMH0.RKu47Pnw-Cg-5zHOTYxCeqRSiLhY9didyYPJ7FhaoAQ' }}
          VITE_PUBLIC_SITE_URL: 'https://amr-exam-platform.vercel.app'

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode Project (Simulator / App Archive)
        run: |
          cd ios/App
          xcodebuild -scheme App -project App.xcodeproj -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Compress iOS App Directory for Xcode & TestFlight
        run: |
          cd ios
          zip -r ../Meqyas-iOS-Xcode-Project.zip App

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meqyas-iOS-Xcode-Project
          path: Meqyas-iOS-Xcode-Project.zip
